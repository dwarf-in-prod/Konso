<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Fuel consumption and car maintenance tracker. Offline, private, open source." />
    <meta name="theme-color" content="#f9f9ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <!-- Web version (PWA): manifest and icons come from web/ (tools/build-web.js), not from the Android app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Konso" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Konso</title>
    <!-- Konso: the screens. Behaviour in app.js, styles in app.css, texts in i18n.js (data-i18n attributes). -->
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- Top bar: Konso logo and name on the left, car selector in the middle, settings (gear) on the right -->
    <header class="appbar">
      <!-- The app icon (same drawing as res/drawable/ic_fg.xml on the ic_bg colour) and the app's name
           (a brand name, the same in every language, like the page title) -->
      <div class="brand">
        <svg class="logo" viewBox="0 0 108 108" aria-hidden="true">
          <rect width="108" height="108" rx="24" fill="#1F4E79" />
          <path fill="#FFFFFF" d="M54,26 C54,26 35,49 35,63 C35,73.5 43.5,82 54,82 C64.5,82 73,73.5 73,63 C73,49 54,26 54,26 Z" />
          <path fill="none" stroke="#1F4E79" stroke-width="4" stroke-linecap="round" d="M43,68 A11.5,11.5 0 1 1 65,68" />
          <path fill="none" stroke="#1F4E79" stroke-width="4" stroke-linecap="round" d="M54,65 L61,56" />
          <path fill="#1F4E79" d="M50.4,65 A3.6,3.6 0 1 0 57.6,65 A3.6,3.6 0 1 0 50.4,65 Z" />
        </svg>
        <span class="appname">Konso</span>
      </div>
      <!-- The name of the selected car is shown centered with its arrow (#carShown); the native menu
           (#car) lies invisible on top of the whole area and opens when it is tapped. -->
      <div class="carsel">
        <span class="cur"
          ><span id="carShown"></span><svg class="i" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" /></svg
        ></span>
        <select id="car" data-i18n-title="car_label"></select>
      </div>
      <button class="icon" id="setBtn" data-i18n-title="nav_settings">
        <svg class="i" viewBox="0 0 24 24">
          <path
            d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.61l-1.92-3.32a.5.5 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.5.5 0 00-.48-.41h-3.84a.5.5 0 00-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 00-.59.22L2.74 8.87a.5.5 0 00.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.5.5 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 00-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"
          />
        </svg>
      </button>
    </header>

    <main>
      <!-- Amber banner shown when a service is due -->
      <button class="svcbar hide" id="svcBar">
        <svg class="i" viewBox="0 0 24 24">
          <path
            d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"
          /></svg
        ><span id="svcBarTxt"></span
        ><svg class="i" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" /></svg>
      </button>
      <!-- Tab 1: fill-ups (receipt scan, form, history) -->
      <section id="fuel">
        <div class="card">
          <div id="scan" class="hide">
            <label class="btn tonal first" for="sc1"
              ><svg class="i" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3.2" />
                <path
                  d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"
                /></svg
              ><span data-i18n="scan_btn"></span
            ></label>
            <input type="file" id="sc1" accept="image/*" hidden />
            <div class="note" id="scanHint" style="margin: 8px 0 0" data-i18n="scan_hint"></div>
            <div id="scanres" class="scanres hide"></div>
          </div>
          <div class="grid" style="margin-top: 20px">
            <div class="f fl"><input type="date" id="fd" /><label for="fd" data-i18n="date"></label></div>
            <div class="f">
              <input type="number" id="fk" inputmode="decimal" step="0.1" placeholder=" " /><label
                for="fk"
                data-i18n="distance"
              ></label>
            </div>
            <div class="f">
              <input type="number" id="fl" inputmode="decimal" step="0.01" placeholder=" " /><label
                for="fl"
                data-i18n="litres"
              ></label>
            </div>
            <div class="f">
              <input type="number" id="fe" inputmode="decimal" step="0.01" placeholder=" " /><label
                for="fe"
                data-i18n="amount"
              ></label>
            </div>
            <div class="f fl sel">
              <button type="button" class="fieldbtn" id="fc"></button
              ><label data-i18n="fuel"></label>
            </div>
            <div class="f">
              <input type="text" id="fs" placeholder=" " /><label for="fs" data-i18n="station"></label>
            </div>
          </div>
          <!-- live results: hidden until there is something to show (live() in app.js) -->
          <div class="live hide" id="live">
            <div><b id="l1">–</b><span data-i18n="k_l100"></span></div>
            <div><b id="l2">–</b><span data-i18n="k_e100"></span></div>
            <div><b id="l3">–</b><span data-i18n="k_el"></span></div>
          </div>
          <button class="btn" id="addF" data-i18n="add_fill"></button>
          <!-- first-use tip, hidden once the car has fill-ups (showTips() in app.js) -->
          <div class="note" id="fillTip" data-i18n="fill_tip"></div>
        </div>
        <div class="hist">
          <h2 class="sec" data-i18n="hist_fuel"></h2>
          <div class="card" id="fl-list"></div>
        </div>
      </section>

      <!-- Tab 2: stations. Official prices of French stations (data.economie.gouv.fr), only when the user
           turns the switch on: Konso does not use the internet otherwise. Chart of the fuel price of the
           selected car, followed stations, search by postcode (renderStations() in app.js). -->
      <section id="stations" class="hide">
        <!-- connection switch; once the connection is allowed, only the switch remains, on one short
             line (.compact), to leave room for the map and the start of My stations -->
        <div class="card" id="stSwitchCard">
          <h3 data-i18n="st_title"></h3>
          <!-- explanation hidden once the connection is allowed (setOnline() in app.js) -->
          <div class="note" id="stIntro" style="margin-top: 0" data-i18n="st_intro"></div>
          <label class="switch">
            <input type="checkbox" id="stOnline" /><span class="trk"></span><span data-i18n="st_switch"></span>
          </label>
        </div>
        <!-- Map of the stations in view with the price of the car's fuel (mapShow() and the "Stations map"
             section of app.js), shown while the connection is allowed. The map tiles come from OpenStreetMap. -->
        <div class="card hide" id="stMapCard">
          <h3 id="stMapT"></h3>
          <div class="stmapwrap">
            <div id="stMap"></div>
            <button class="maploc" id="stLocate" data-i18n-title="map_locate">
              <svg class="i" viewBox="0 0 24 24">
                <path
                  d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"
                />
              </svg>
            </button>
          </div>
          <div class="note" id="stMapNote"></div>
        </div>
        <div class="hist">
          <h2 class="sec" data-i18n="st_list"></h2>
          <div class="card" id="st-list"></div>
          <div class="note" id="stOff"></div>
          <div id="stTools">
            <div class="note" id="stUpd"></div>
            <button class="btn tonal" id="stRefresh" data-i18n="st_refresh"></button>
            <div class="card" id="stAdd" style="margin-top: 16px">
              <h3 data-i18n="st_add"></h3>
              <div class="stsearch">
                <div class="f">
                  <input type="text" id="stCp" inputmode="numeric" maxlength="5" placeholder=" " /><label
                    for="stCp"
                    data-i18n="st_cp"
                  ></label>
                </div>
                <button class="btn" id="stSearch" data-i18n="st_search"></button>
              </div>
              <div id="stRes"></div>
            </div>
          </div>
        </div>
        <!-- price of the car's fuel over time: the user's fill-ups and the followed stations -->
        <div class="card" style="margin-top: 12px">
          <h3 id="stChartT"></h3>
          <div class="legend" id="stLegend"></div>
          <div class="chart" id="c3"></div>
        </div>
      </section>

      <!-- Tab 3: stats (figures, charts, spending) -->
      <section id="stats" class="hide">
        <div class="card">
          <div class="stats" id="sf"></div>
          <div class="note" id="sfn"></div>
        </div>
        <div class="card">
          <h3 data-i18n="s_chart1"></h3>
          <div class="chart" id="c1"></div>
          <div class="sum" id="c1s"></div>
        </div>
        <div class="card">
          <h3 data-i18n="s_chart2"></h3>
          <div class="legend">
            <span><i style="background: var(--s1)"></i><span data-i18n="fuel"></span></span
            ><span><i style="background: var(--s2)"></i><span data-i18n="buys"></span></span>
          </div>
          <div class="chart" id="c2"></div>
        </div>
        <div class="card">
          <h3 data-i18n="s_spend"></h3>
          <div id="sx"></div>
          <div id="cats" style="margin-top: 16px"></div>
          <!-- Reminder: the purchases are entered in My garage -> Purchases; the link opens it -->
          <div class="note">
            <span data-i18n="s_buys_hint"></span>
            <button type="button" class="link" id="sxGo" data-i18n="s_buys_open"></button>
          </div>
        </div>
      </section>

      <!-- Tab 4: my garage, in two parts chosen with the buttons at the top: the cars (list, add, edit /
           delete form, car purchase & payback) and the purchases -->
      <section id="garage" class="hide">
        <div class="seg" role="tablist">
          <button data-g="cars" class="on" data-i18n="g_cars"></button
          ><button data-g="buys" data-i18n="buys"></button>
        </div>
        <div id="garCars">
          <div id="garList">
            <div class="card" id="cars-list"></div>
            <button class="btn" id="carAdd" data-i18n="car_add"></button>
            <div class="note" data-i18n="g_hint"></div>
            <!-- "Car purchase & payback": folded under a button, so the garage stays simple; other
                 tools can be added inside later. -->
            <details class="card fold" id="planFold">
              <summary>
                <span class="carico"
                  ><svg class="i" viewBox="0 0 24 24">
                    <path
                      d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5.97 4.06L14.09 6l1.41 1.41L16.91 6l1.06 1.06-1.41 1.41 1.41 1.41-1.06 1.06-1.41-1.4-1.41 1.41-1.06-1.06 1.41-1.41-1.41-1.42zm-6.78.66h5v1.5h-5v-1.5zM11.5 16h-2v2H8v-2H6v-1.5h2v-2h1.5v2h2V16zm6.5 1.25h-5v-1.5h5v1.5zm0-2.5h-5v-1.5h5v1.5z"
                    /></svg></span
                ><span class="lbl" data-i18n="pl_fold"></span
                ><svg class="i chev" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z" /></svg>
              </summary>
              <!-- Buying a new car: what the change costs and when it pays for itself, worked out while
                   the user types (renderPlan() and planResult() in app.js). Everything is saved. -->
              <div id="plan">
                <div class="note" style="margin-top: 0" data-i18n="pl_intro"></div>
                <h4 class="sub" data-i18n="pl_new"></h4>
                <div class="grid">
                  <div class="f full">
                    <input type="number" id="pPrice" inputmode="decimal" step="0.01" min="0" placeholder=" " /><label
                      for="pPrice"
                      data-i18n="car_price"
                    ></label>
                  </div>
                  <div class="f">
                    <input type="number" id="pIns" inputmode="decimal" step="0.01" min="0" placeholder=" " /><label
                      for="pIns"
                      data-i18n="car_ins"
                    ></label>
                  </div>
                  <div class="f fl sel">
                    <button type="button" class="fieldbtn" id="pInsPer"></button
                    ><label data-i18n="car_ins_per"></label>
                  </div>
                  <div class="f full">
                    <input type="number" id="pCons" inputmode="decimal" step="0.1" min="0" placeholder=" " /><label
                      for="pCons"
                      data-i18n="pl_cons"
                    ></label>
                  </div>
                  <div class="f full">
                    <input type="number" id="pFuel" inputmode="decimal" step="0.001" min="0" placeholder=" " /><label
                      for="pFuel"
                      data-i18n="pl_fuel"
                    ></label>
                  </div>
                </div>
                <h4 class="sub" id="pCurT"></h4>
                <div class="grid">
                  <div class="f full">
                    <input type="number" id="pKm" inputmode="numeric" step="1" min="0" placeholder=" " /><label
                      for="pKm"
                      data-i18n="pl_km"
                    ></label>
                  </div>
                  <div class="note full fnote" id="pKmN"></div>
                  <div class="f full">
                    <input type="number" id="pResale" inputmode="decimal" step="1" min="0" placeholder=" " /><label
                      for="pResale"
                      data-i18n="pl_resale"
                    ></label>
                  </div>
                </div>
                <label class="switch">
                  <input type="checkbox" id="pWith" /><span class="trk"></span><span data-i18n="pl_with"></span>
                </label>
                <div class="note" id="pWithN"></div>
                <div class="planres" id="pRes"></div>
                <button class="btn tonal" id="pReset" data-i18n="pl_reset"></button>
              </div>
            </details>
          </div>
          <!-- Add / edit car form (hides the list while open) -->
          <div class="card hide" id="carForm">
            <h3 id="carFormTitle"></h3>
            <div class="grid">
              <div class="f full">
                <input type="text" id="carName" maxlength="40" placeholder=" " /><label
                  for="carName"
                  data-i18n="car_name"
                ></label>
              </div>
              <div class="f full fl sel">
                <button type="button" class="fieldbtn" id="carFuel"></button
                ><label data-i18n="car_fuel"></label>
              </div>
            </div>
            <!-- Optional details of the car, folded: purchase price, mileage at purchase, insurance -->
            <details id="carAdv">
              <summary data-i18n="car_adv"></summary>
              <div class="note" data-i18n="car_adv_note"></div>
              <div class="grid" style="margin-top: 12px">
                <div class="f full">
                  <input type="number" id="carPrice" inputmode="decimal" step="0.01" min="0" placeholder=" " /><label
                    for="carPrice"
                    data-i18n="car_price"
                  ></label>
                </div>
                <div class="f full">
                  <input type="number" id="carBuyKm" inputmode="numeric" step="1" min="0" placeholder=" " /><label
                    for="carBuyKm"
                    data-i18n="car_buykm"
                  ></label>
                </div>
                <div class="f full">
                  <input type="number" id="carIns" inputmode="decimal" step="0.01" min="0" placeholder=" " /><label
                    for="carIns"
                    data-i18n="car_ins"
                  ></label>
                </div>
                <div class="f full fl sel">
                  <button type="button" class="fieldbtn" id="carInsPer"></button
                  ><label data-i18n="car_ins_per"></label>
                </div>
              </div>
            </details>
            <div class="btns2">
              <button class="btn tonal" id="carCancel" data-i18n="cancel"></button>
              <button class="btn" id="carSave" data-i18n="save"></button>
            </div>
            <button class="btn danger hide" id="carDel"></button>
            <div class="note" id="carNote"></div>
          </div>
        </div>
        <!-- Purchases (form, history), the second part of the garage -->
        <div id="buys" class="hide">
          <div class="card">
            <div class="grid" style="margin-top: 6px">
              <div class="f fl"><input type="date" id="bd" /><label for="bd" data-i18n="date"></label></div>
              <div class="f">
                <input type="number" id="be" inputmode="decimal" step="0.01" placeholder=" " /><label
                  for="be"
                  data-i18n="amount"
                ></label>
              </div>
              <div class="f fl sel full">
                <button type="button" class="fieldbtn" id="bc"></button><label data-i18n="category"></label>
              </div>
              <div class="f full">
                <input type="text" id="bn" placeholder=" " /><label for="bn" data-i18n="description"></label>
              </div>
              <div class="f">
                <input type="number" id="bk" inputmode="numeric" placeholder=" " /><label
                  for="bk"
                  data-i18n="odometer"
                ></label>
              </div>
              <div class="f">
                <input type="text" id="bs" placeholder=" " /><label for="bs" data-i18n="shop"></label>
              </div>
            </div>
            <button class="btn" id="addB" data-i18n="add_buy"></button>
          </div>
          <div class="hist">
            <h2 class="sec" data-i18n="hist_buys"></h2>
            <div class="card" id="bl-list"></div>
          </div>
      </div>
      </section>

      <!-- Settings, opened with the gear of the top bar (install, language, units, currency, theme, servicing, backup, help) -->
      <section id="save" class="hide">
        <!-- Two columns on wide screens: these cards on the left, the help on the right -->
        <div class="col">
          <!-- Web version only: how to install the app (renderInstall() in app.js) -->
          <div class="card hide" id="inst">
            <h3 data-i18n="inst_title"></h3>
            <div class="note" id="inst-how" style="margin-top: 0"></div>
            <button class="btn" id="inst-btn" data-i18n="inst_btn"></button>
          </div>
          <div class="card" id="prefs">
            <div class="grid">
              <div class="f fl sel full">
                <button type="button" class="fieldbtn" id="langBtn"></button
                ><label data-i18n="set_lang"></label>
              </div>
              <div class="f fl sel full">
                <button type="button" class="fieldbtn" id="unitBtn"></button
                ><label data-i18n="set_units"></label>
              </div>
              <div class="f fl sel full">
                <button type="button" class="fieldbtn" id="moneyBtn"></button
                ><label data-i18n="set_money"></label>
              </div>
              <div class="f fl sel full">
                <button type="button" class="fieldbtn" id="themeBtn"></button
                ><label data-i18n="set_theme"></label>
              </div>
            </div>
          </div>
          <div class="card" id="svcCard">
            <h3 data-i18n="svc_title"></h3>
            <div class="sum" id="svcInfo"></div>
            <div class="note" data-i18n="svc_note"></div>
            <button class="btn tonal" id="svcKmBtn" data-i18n="svc_change"></button>
          </div>
          <div class="card" id="backup">
            <h3 id="sv-title"></h3>
            <div id="sv-folder" class="sum"></div>
            <div id="sv-pending" class="scanres warn hide"></div>
            <div id="sv-btns" class="hide">
              <button class="btn" id="sv-pick"></button>
              <button class="btn tonal" id="sv-now" data-i18n="b_now"></button>
              <button class="btn tonal" id="sv-reload" data-i18n="b_reload"></button>
            </div>
            <!-- Web version: no folder, backup files saved and opened by the user -->
            <div id="sv-web" class="hide">
              <button class="btn" id="sv-export" data-i18n="b_export"></button>
              <button class="btn tonal" id="sv-open" data-i18n="b_import"></button>
              <input type="file" id="sv-file" accept=".json,application/json" hidden />
              <div class="note" id="sv-last"></div>
            </div>
            <div class="note" id="sv-count"></div>
            <details id="sv-drive">
              <summary data-i18n="drive_title"></summary>
              <div class="note" data-i18n-html="drive_steps"></div>
              <div class="note" data-i18n="drive_note"></div>
            </details>
            <details>
              <summary data-i18n="manual_title"></summary>
              <textarea id="sv-text" rows="6" style="margin-top: 8px" data-i18n-ph="manual_ph"></textarea>
              <div class="btns2">
                <button class="btn tonal" id="sv-copy" data-i18n="manual_copy"></button
                ><button class="btn tonal" id="sv-import" data-i18n="manual_import"></button>
              </div>
              <div class="note" data-i18n="manual_note"></div>
            </details>
          </div>
        </div>
        <div class="card" id="help">
          <h3 data-i18n="help_title"></h3>
          <details>
            <summary data-i18n="help_q1"></summary>
            <div class="note" data-i18n-html="help_a1"></div>
          </details>
          <details>
            <summary data-i18n="help_q2"></summary>
