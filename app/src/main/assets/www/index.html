<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Konso</title>
    <!-- Konso: the screens. Behaviour in app.js, styles in app.css, texts in i18n.js (data-i18n attributes). -->
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- Top bar: car selector, add a car, edit the car -->
    <header class="appbar">
      <div class="carsel">
        <select id="car" data-i18n-title="car_label"></select>
        <svg class="i" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" /></svg>
      </div>
      <button class="icon" id="carAdd" data-i18n-title="car_add">
        <svg class="i" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" /></svg>
      </button>
      <button class="icon" id="carEdit" data-i18n-title="car_edit">
        <svg class="i" viewBox="0 0 24 24">
          <path
            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
          />
        </svg>
      </button>
    </header>

    <main>
      <!-- Amber banner shown when a service is due -->
      <button class="svcbar hide" id="svcBar">
        <svg class="i" viewBox="0 0 24 24">
          <path
            d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"
          /></svg
        ><span id="svcBarTxt"></span
        ><svg class="i" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" /></svg>
      </button>
      <!-- Add / edit car form -->
      <div class="card hide" id="carForm">
        <h3 id="carFormTitle"></h3>
        <div class="grid">
          <div class="f full">
            <input type="text" id="carName" maxlength="40" placeholder=" " /><label
              for="carName"
              data-i18n="car_name"
            ></label>
          </div>
          <div class="f full fl sel">
            <select id="carFuel"></select
            ><label for="carFuel" data-i18n="car_fuel"></label>
          </div>
        </div>
        <div class="btns2">
          <button class="btn tonal" id="carCancel" data-i18n="cancel"></button>
          <button class="btn" id="carSave" data-i18n="save"></button>
        </div>
        <button class="btn danger hide" id="carDel"></button>
        <div class="note" id="carNote"></div>
      </div>

      <!-- Tab 1: fill-ups (receipt scan, form, history) -->
      <section id="fuel">
        <div class="card">
          <div id="scan" class="hide">
            <label class="btn tonal first" for="sc1"
              ><svg class="i" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3.2" />
                <path
                  d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"
                /></svg
              ><span data-i18n="scan_btn"></span
            ></label>
            <input type="file" id="sc1" accept="image/*" hidden />
            <div class="note" style="margin: 8px 0 16px" data-i18n="scan_hint"></div>
            <div id="scanres" class="scanres hide"></div>
          </div>
          <div class="grid" style="margin-top: 6px">
            <div class="f fl"><input type="date" id="fd" /><label for="fd" data-i18n="date"></label></div>
            <div class="f">
              <input type="number" id="fk" inputmode="decimal" step="0.1" placeholder=" " /><label
                for="fk"
                data-i18n="distance"
              ></label>
            </div>
            <div class="f">
              <input type="number" id="fl" inputmode="decimal" step="0.01" placeholder=" " /><label
                for="fl"
                data-i18n="litres"
              ></label>
            </div>
            <div class="f">
              <input type="number" id="fe" inputmode="decimal" step="0.01" placeholder=" " /><label
                for="fe"
                data-i18n="amount"
              ></label>
            </div>
            <div class="f fl sel">
              <select id="fc"></select
              ><label for="fc" data-i18n="fuel"></label>
            </div>
            <div class="f">
              <input type="text" id="fs" placeholder=" " /><label for="fs" data-i18n="station"></label>
            </div>
          </div>
          <div class="live" id="live">
            <div><b id="l1">–</b><span data-i18n="k_l100"></span></div>
            <div><b id="l2">–</b><span data-i18n="k_e100"></span></div>
            <div><b id="l3">–</b><span data-i18n="k_el"></span></div>
          </div>
          <button class="btn" id="addF" data-i18n="add_fill"></button>
          <div class="note" data-i18n="fill_tip"></div>
        </div>
        <h2 class="sec" data-i18n="hist_fuel"></h2>
        <div class="card" id="fl-list"></div>
      </section>

      <!-- Tab 2: purchases (form, history) -->
      <section id="buys" class="hide">
        <div class="card">
          <div class="grid" style="margin-top: 6px">
            <div class="f fl"><input type="date" id="bd" /><label for="bd" data-i18n="date"></label></div>
            <div class="f">
              <input type="number" id="be" inputmode="decimal" step="0.01" placeholder=" " /><label
                for="be"
                data-i18n="amount"
              ></label>
            </div>
            <div class="f fl sel full">
              <button type="button" class="fieldbtn" id="bc"></button><label data-i18n="category"></label>
            </div>
            <div class="f full">
              <input type="text" id="bn" placeholder=" " /><label for="bn" data-i18n="description"></label>
            </div>
            <div class="f">
              <input type="number" id="bk" inputmode="numeric" placeholder=" " /><label
                for="bk"
                data-i18n="odometer"
              ></label>
            </div>
            <div class="f">
              <input type="text" id="bs" placeholder=" " /><label for="bs" data-i18n="shop"></label>
            </div>
          </div>
          <button class="btn" id="addB" data-i18n="add_buy"></button>
        </div>
        <h2 class="sec" data-i18n="hist_buys"></h2>
        <div class="card" id="bl-list"></div>
      </section>

      <!-- Tab 3: stats (figures, charts, spending) -->
      <section id="stats" class="hide">
        <div class="card">
          <div class="stats" id="sf"></div>
          <div class="note" id="sfn"></div>
        </div>
        <div class="card">
          <h3 data-i18n="s_chart1"></h3>
          <div class="chart" id="c1"></div>
          <div class="sum" id="c1s"></div>
        </div>
        <div class="card">
          <h3 data-i18n="s_chart2"></h3>
          <div class="legend">
            <span><i style="background: var(--s1)"></i><span data-i18n="fuel"></span></span
            ><span><i style="background: var(--s2)"></i><span data-i18n="buys"></span></span>
          </div>
          <div class="chart" id="c2"></div>
        </div>
        <div class="card">
          <h3 data-i18n="s_spend"></h3>
          <div id="sx"></div>
          <div id="cats" style="margin-top: 16px"></div>
        </div>
      </section>

      <!-- Tab 4: settings (language, units, currency, servicing, backup, help) -->
      <section id="save" class="hide">
        <div class="card">
          <div class="grid">
            <div class="f fl sel full">
              <button type="button" class="fieldbtn" id="langBtn"></button
              ><label data-i18n="set_lang"></label>
            </div>
            <div class="f fl sel full">
              <button type="button" class="fieldbtn" id="unitBtn"></button
              ><label data-i18n="set_units"></label>
            </div>
            <div class="f fl sel full">
              <button type="button" class="fieldbtn" id="moneyBtn"></button
              ><label data-i18n="set_money"></label>
            </div>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="svc_title"></h3>
          <div class="sum" id="svcInfo"></div>
          <div class="note" data-i18n="svc_note"></div>
          <button class="btn tonal" id="svcKmBtn" data-i18n="svc_change"></button>
        </div>
        <div class="card">
          <h3 data-i18n="set_backup"></h3>
          <div id="sv-folder" class="sum"></div>
          <div id="sv-pending" class="scanres warn hide"></div>
          <div id="sv-btns" class="hide">
            <button class="btn" id="sv-pick"></button>
            <button class="btn tonal" id="sv-now" data-i18n="b_now"></button>
            <button class="btn tonal" id="sv-reload" data-i18n="b_reload"></button>
          </div>
          <div class="note" id="sv-count"></div>
          <details>
            <summary data-i18n="drive_title"></summary>
            <div class="note" data-i18n-html="drive_steps"></div>
            <div class="note" data-i18n="drive_note"></div>
          </details>
          <details>
            <summary data-i18n="manual_title"></summary>
            <textarea id="sv-text" rows="6" style="margin-top: 8px" data-i18n-ph="manual_ph"></textarea>
            <div class="btns2">
              <button class="btn tonal" id="sv-copy" data-i18n="manual_copy"></button
              ><button class="btn tonal" id="sv-import" data-i18n="manual_import"></button>
            </div>
            <div class="note" data-i18n="manual_note"></div>
          </details>
        </div>
        <div class="card">
          <h3 data-i18n="help_title"></h3>
          <details>
            <summary data-i18n="help_q1"></summary>
            <div class="note" data-i18n-html="help_a1"></div>
          </details>
          <details>
            <summary data-i18n="help_q2"></summary>
            <div class="note" data-i18n-html="help_a2"></div>
          </details>
          <details>
            <summary data-i18n="help_q3"></summary>
            <div class="note" data-i18n-html="help_a3"></div>
          </details>
          <details>
            <summary data-i18n="help_q4"></summary>
            <div class="note" data-i18n-html="help_a4"></div>
          </details>
          <details>
            <summary data-i18n="help_q5"></summary>
            <div class="note" data-i18n-html="help_a5"></div>
          </details>
          <details>
            <summary data-i18n="help_q6"></summary>
            <div class="note" data-i18n-html="help_a6"></div>
          </details>
          <details>
            <summary data-i18n="help_q7"></summary>
            <div class="note" data-i18n-html="help_a7"></div>
          </details>
          <details>
            <summary data-i18n="help_q8"></summary>
            <div class="note" data-i18n-html="help_a8"></div>
          </details>
          <details>
            <summary data-i18n="help_q9"></summary>
            <div class="note" data-i18n-html="help_a9"></div>
          </details>
          <details>
            <summary data-i18n="help_q10"></summary>
            <div class="note" data-i18n-html="help_a10"></div>
          </details>
        </div>
      </section>
    </main>

    <!-- Bottom navigation bar -->
    <nav class="nav">
      <button data-t="fuel" class="on">
        <span class="pill"
          ><svg class="i" viewBox="0 0 24 24">
            <path
              d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11A2.5 2.5 0 0015.5 9 2.5 2.5 0 0018 11.5c.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5A2.5 2.5 0 0018 21a2.5 2.5 0 002.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"
            /></svg></span
        ><span class="lbl" data-i18n="nav_fuel"></span>
      </button>
      <button data-t="buys">
        <span class="pill"
          ><svg class="i" viewBox="0 0 24 24">
            <path
              d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"
            /></svg></span
        ><span class="lbl" data-i18n="buys"></span>
      </button>
      <button data-t="stats">
        <span class="pill"
          ><svg class="i" viewBox="0 0 24 24">
            <path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z" /></svg></span
        ><span class="lbl" data-i18n="nav_stats"></span>
      </button>
      <button data-t="save">
        <span class="pill"
          ><svg class="i" viewBox="0 0 24 24">
            <path
              d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.61l-1.92-3.32a.5.5 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.5.5 0 00-.48-.41h-3.84a.5.5 0 00-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 00-.59.22L2.74 8.87a.5.5 0 00.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.5.5 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 00-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"
            /></svg></span
        ><span class="lbl" data-i18n="nav_settings"></span>
      </button>
    </nav>

    <!-- Status message (snackbar) -->
    <div id="st" role="status"></div>

    <!-- First launch: language wheel -->
    <div id="lang" class="lang hide">
      <div class="wrap">
        <svg class="i" viewBox="0 0 24 24" style="width: 40px; height: 40px; color: var(--primary)">
          <path
            d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 00-1.38-3.56A8.03 8.03 0 0118.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 015.08 16zm2.95-8H5.08a7.99 7.99 0 014.33-3.56A15.65 15.65 0 008.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 01-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"
          />
        </svg>
        <h1 data-i18n="lang_pick"></h1>
        <div class="note" style="margin: -8px 0 16px" data-i18n="step1"></div>
        <div class="wheel">
          <div class="band"></div>
          <div class="wl" id="wheel-list"></div>
        </div>
        <button class="btn" id="lang-next" data-i18n="next"></button>
      </div>
    </div>

    <!-- Full-screen wheel used for every other choice (picker() in app.js) -->
    <div id="picker" class="lang hide">
      <div class="wrap">
        <svg class="i" viewBox="0 0 24 24" id="pkIcon" style="width: 40px; height: 40px">
          <path id="pkPath" d="" />
        </svg>
        <h1 id="pkTitle"></h1>
        <div class="note" style="margin: -8px 0 16px" id="pkSub"></div>
        <div class="wheel">
          <div class="band"></div>
          <div class="wl" id="pk-list"></div>
        </div>
        <div class="btns2">
          <button class="btn tonal" id="pk-cancel" data-i18n="cancel"></button
          ><button class="btn" id="pk-ok" data-i18n="validate"></button>
        </div>
      </div>
    </div>

    <!-- Dialog in the middle of the screen (dialog() in app.js) -->
    <div id="dlg" class="scrim hide">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT">
        <svg class="i" viewBox="0 0 24 24">
          <path
            d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"
          />
        </svg>
        <h2 id="dlgT"></h2>
        <div id="dlgM"></div>
        <div class="dbtns" id="dlgB"></div>
      </div>
    </div>

    <!-- Texts, receipt parser, OCR engine, then the app itself (it starts at the end of app.js) -->
    <script src="i18n.js"></script>
    <script src="parse.js"></script>
    <script src="vendor/tesseract.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
