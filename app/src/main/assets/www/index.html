<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Konso</title>
<style>
/* Material Design 3 : surfaces tonales, formes arrondies, barre de navigation en bas */
:root{
  --primary:#415f91;--on-primary:#fff;--primary-c:#d6e3ff;--on-primary-c:#001b3e;
  --secondary-c:#dbe2f9;--on-secondary-c:#141b2c;
  --surface:#f9f9ff;--surf:#edeef4;--surf-high:#e7e8ee;
  --on-surf:#191c20;--on-surf-v:#44474e;--outline:#74777f;--outline-v:#c4c6d0;
  --error:#ba1a1a;--on-error:#fff;--inverse:#2e3036;--on-inverse:#f0f0f7;
  --s1:#2a78d6;--s2:#eb6834;--font:system-ui,Roboto,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{
  --primary:#aac7ff;--on-primary:#0a305f;--primary-c:#284777;--on-primary-c:#d6e3ff;
  --secondary-c:#3e4759;--on-secondary-c:#dbe2f9;
  --surface:#111318;--surf:#1d2024;--surf-high:#282a2f;
  --on-surf:#e2e2e9;--on-surf-v:#c4c6d0;--outline:#8e9099;--outline-v:#44474e;
  --error:#ffb4ab;--on-error:#690005;--inverse:#e2e2e9;--on-inverse:#2e3036;
  --s1:#3987e5;--s2:#d95926}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--surface)}
@keyframes tabin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
section.tabin{animation:tabin .32s cubic-bezier(.2,0,0,1)}
@media(prefers-reduced-motion:reduce){section.tabin{animation:none}}
body{margin:0;background:var(--surface);color:var(--on-surf);font:16px/1.5 var(--font);max-width:640px;margin-inline:auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
.hide{display:none!important}

/* barre du haut */
.appbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;height:64px;padding:0 8px 0 16px;background:var(--surface)}
.carsel{position:relative;flex:1;min-width:0}
.carsel select{appearance:none;-webkit-appearance:none;width:100%;border:0;background:transparent;color:var(--on-surf);font:500 22px/1.2 var(--font);padding:8px 32px 8px 0;text-overflow:ellipsis;outline:none}
.carsel svg{position:absolute;right:0;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--on-surf-v)}
.icon{width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:var(--on-surf-v);display:grid;place-items:center;padding:0}
.icon:active{background:var(--surf-high)}

main{padding:0 16px}
section{display:block}
h2.sec{font:500 14px/1.4 var(--font);color:var(--on-surf-v);margin:24px 4px 8px;letter-spacing:.1px}
.card{background:var(--surf);border-radius:20px;padding:16px;margin:0 0 12px}
.card h3{font:500 16px/1.4 var(--font);margin:0 0 12px}

/* champs : contour M3 avec libellé flottant */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.full{grid-column:1/-1}
.f{position:relative}
.f input,.f select{width:100%;height:54px;padding:0 14px;border:1px solid var(--outline);border-radius:12px;background:transparent;color:var(--on-surf);font:inherit;outline:none;appearance:none;-webkit-appearance:none}
.f input:focus,.f select:focus{border:2px solid var(--primary);padding:0 13px}
.f label{position:absolute;left:12px;top:15px;padding:0 4px;background:var(--surf);color:var(--on-surf-v);font-size:16px;line-height:22px;pointer-events:none;transition:top .12s,font-size .12s;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f input:focus+label,.f input:not(:placeholder-shown)+label,.f.fl label{top:-10px;font-size:12px;line-height:18px}
.f input:focus+label,.f select:focus+label{color:var(--primary)}
.f.need select{border:2px solid var(--error);padding:0 13px}
.f.need label{color:var(--error)}
.f.sel::after{content:"";position:absolute;right:14px;top:23px;border:5px solid transparent;border-top-color:var(--on-surf-v);pointer-events:none}
textarea{width:100%;padding:12px;border:1px solid var(--outline);border-radius:12px;background:transparent;color:var(--on-surf);font:12px/1.4 monospace;outline:none}

/* boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border:0;border-radius:24px;background:var(--primary);color:var(--on-primary);font:500 15px/1 var(--font);margin-top:14px;cursor:pointer}
.btn:active{filter:brightness(.92)}
.btn.tonal{background:var(--secondary-c);color:var(--on-secondary-c)}
.btn.danger{background:var(--error);color:var(--on-error)}
.btn.first{margin-top:0}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns2 .btn{margin-top:14px}

/* résultat en direct */
.live{background:var(--primary-c);color:var(--on-primary-c);border-radius:16px;padding:12px 8px;margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.live b{display:block;font:500 20px/1.3 var(--font)}
.live span{font-size:12px;opacity:.8}

/* listes */
.row{display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--outline-v)}
.row:first-child{border-top:0}
.row .l{flex:1;min-width:0}
.row .t{font-weight:500}
.row .m{font-size:13px;color:var(--on-surf-v);overflow-wrap:anywhere}
.row .r{text-align:right;white-space:nowrap}
.del{border:0;background:transparent;color:var(--on-surf-v);width:40px;height:40px;border-radius:20px;display:grid;place-items:center;padding:0;flex:none}
.del svg{width:22px;height:22px}
.del.armed{width:auto;padding:0 14px;background:var(--error);color:var(--on-error);font:500 13px var(--font)}
.empty{color:var(--on-surf-v);text-align:center;padding:20px 0;font-size:14px}
.note{font-size:13px;color:var(--on-surf-v);margin-top:12px;line-height:1.5}

/* bilan */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}
.stat b{display:block;font:500 26px/1.2 var(--font);color:var(--primary)}
.stat span{font-size:13px;color:var(--on-surf-v)}
.kv{display:flex;justify-content:space-between;padding:6px 0}
.kv.tot{border-top:1px solid var(--outline-v);margin-top:6px;padding-top:12px;font-weight:500}
.bar{height:8px;border-radius:4px;background:var(--primary-c);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:4px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--on-surf-v);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:6px}
.chart{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{fill:var(--on-surf-v);font-size:11px}
.chart .grid{stroke:var(--outline-v);stroke-width:1}
.tip{position:absolute;top:0;pointer-events:none;background:var(--inverse);color:var(--on-inverse);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translateX(-50%);display:none;z-index:2;line-height:1.4}
.sum{font-size:14px;margin-top:10px;color:var(--on-surf-v)}
.sum b{color:var(--on-surf)}

/* lecture de ticket */
.scanres{background:var(--primary-c);color:var(--on-primary-c);border-radius:16px;padding:12px 14px;font-size:14px;margin:12px 0 0}
.scanres.warn{outline:2px solid var(--error)}
.scanres .w{color:var(--error);margin-top:6px}
.scanres .note{color:inherit;opacity:.8}
details{margin-top:12px}
summary{cursor:pointer;font-weight:500;padding:4px 0}
details .note{margin-top:8px}

/* barre de navigation du bas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;max-width:640px;margin-inline:auto;background:var(--surf);padding:12px 8px calc(16px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:transparent;color:var(--on-surf-v);display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12px/1.2 var(--font);padding:0;min-width:0}
.nav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .15s}
.nav button.on{color:var(--on-surf)}
.nav button.on .pill{background:var(--secondary-c);color:var(--on-secondary-c)}
.nav span.lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.kb .nav{display:none}

/* message d'état (snackbar) */
#st{position:fixed;left:16px;right:16px;bottom:calc(104px + env(safe-area-inset-bottom,0px));max-width:608px;margin-inline:auto;z-index:20;background:var(--inverse);color:var(--on-inverse);border-radius:12px;padding:14px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#st.show{opacity:1}
body.kb #st{bottom:16px}

/* choix de la langue : roue infinie */
.lang{position:fixed;inset:0;z-index:50;background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:24px 20px}
.lang .wrap{width:100%;max-width:440px;margin:0 auto;text-align:center}
.lang h1{font:500 28px/1.25 var(--font);margin:12px 0 20px}
.wheel{--it:56px;position:relative;height:calc(var(--it)*5);margin-bottom:24px}
.wheel .band{position:absolute;left:0;right:0;top:calc(var(--it)*2);height:var(--it);border-radius:16px;background:var(--primary-c);pointer-events:none}
.wl{position:relative;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;padding:calc(var(--it)*2) 0;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wl::-webkit-scrollbar{display:none}
.wl .it{height:var(--it);display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font:500 22px var(--font);color:var(--on-surf-v);cursor:pointer;user-select:none;will-change:transform,opacity}
</style>
</head>
<body>

<header class="appbar">
  <div class="carsel">
    <select id="car" data-i18n-title="car_label"></select>
    <svg class="i" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
  </div>
  <button class="icon" id="carAdd" data-i18n-title="car_add"><svg class="i" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
  <button class="icon" id="carEdit" data-i18n-title="car_edit"><svg class="i" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
</header>

<main>
<div class="card hide" id="carForm">
  <h3 id="carFormTitle"></h3>
  <div class="grid">
    <div class="f full"><input type="text" id="carName" maxlength="40" placeholder=" "><label for="carName" data-i18n="car_name"></label></div>
    <div class="f full fl sel"><select id="carFuel"></select><label for="carFuel" data-i18n="car_fuel"></label></div>
  </div>
  <div class="btns2">
    <button class="btn tonal" id="carCancel" data-i18n="cancel"></button>
    <button class="btn" id="carSave" data-i18n="save"></button>
  </div>
  <button class="btn danger hide" id="carDel"></button>
  <div class="note" id="carNote"></div>
</div>

<section id="fuel">
  <div class="card">
    <div id="scan" class="hide">
      <label class="btn tonal first" for="sc1"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg><span data-i18n="scan_btn"></span></label>
      <input type="file" id="sc1" accept="image/*" hidden>
      <div class="note" style="margin:8px 0 16px" data-i18n="scan_hint"></div>
      <div id="scanres" class="scanres hide"></div>
    </div>
    <div class="grid" style="margin-top:6px">
      <div class="f fl"><input type="date" id="fd"><label for="fd" data-i18n="date"></label></div>
      <div class="f"><input type="number" id="fk" inputmode="decimal" step="0.1" placeholder=" "><label for="fk" data-i18n="distance"></label></div>
      <div class="f"><input type="number" id="fl" inputmode="decimal" step="0.01" placeholder=" "><label for="fl" data-i18n="litres"></label></div>
      <div class="f"><input type="number" id="fe" inputmode="decimal" step="0.01" placeholder=" "><label for="fe" data-i18n="amount"></label></div>
      <div class="f fl sel"><select id="fc"></select><label for="fc" data-i18n="fuel"></label></div>
      <div class="f"><input type="text" id="fs" placeholder=" "><label for="fs" data-i18n="station"></label></div>
    </div>
    <div class="live" id="live">
      <div><b id="l1">–</b><span data-i18n="k_l100"></span></div>
      <div><b id="l2">–</b><span data-i18n="k_e100"></span></div>
      <div><b id="l3">–</b><span data-i18n="k_el"></span></div>
    </div>
    <button class="btn" id="addF" data-i18n="add_fill"></button>
    <div class="note" data-i18n="fill_tip"></div>
  </div>
  <h2 class="sec" data-i18n="hist_fuel"></h2>
  <div class="card" id="fl-list"></div>
</section>

<section id="buys" class="hide">
  <div class="card">
    <div class="grid" style="margin-top:6px">
      <div class="f fl"><input type="date" id="bd"><label for="bd" data-i18n="date"></label></div>
      <div class="f"><input type="number" id="be" inputmode="decimal" step="0.01" placeholder=" "><label for="be" data-i18n="amount"></label></div>
      <div class="f fl sel full"><select id="bc"></select><label for="bc" data-i18n="category"></label></div>
      <div class="f full"><input type="text" id="bn" placeholder=" "><label for="bn" data-i18n="description"></label></div>
      <div class="f"><input type="number" id="bk" inputmode="numeric" placeholder=" "><label for="bk" data-i18n="odometer"></label></div>
      <div class="f"><input type="text" id="bs" placeholder=" "><label for="bs" data-i18n="shop"></label></div>
    </div>
    <button class="btn" id="addB" data-i18n="add_buy"></button>
  </div>
  <h2 class="sec" data-i18n="hist_buys"></h2>
  <div class="card" id="bl-list"></div>
</section>

<section id="stats" class="hide">
  <div class="card"><div class="stats" id="sf"></div><div class="note" id="sfn"></div></div>
  <div class="card"><h3 data-i18n="s_chart1"></h3><div class="chart" id="c1"></div><div class="sum" id="c1s"></div></div>
  <div class="card"><h3 data-i18n="s_chart2"></h3>
    <div class="legend"><span><i style="background:var(--s1)"></i><span data-i18n="fuel"></span></span><span><i style="background:var(--s2)"></i><span data-i18n="buys"></span></span></div>
    <div class="chart" id="c2"></div></div>
  <div class="card"><h3 data-i18n="s_spend"></h3><div id="sx"></div><div id="cats" style="margin-top:16px"></div></div>
</section>

<section id="save" class="hide">
  <div class="card">
    <div class="f fl sel"><select id="langSel"></select><label for="langSel" data-i18n="set_lang"></label></div>
  </div>
  <div class="card">
    <h3 data-i18n="set_backup"></h3>
    <div id="sv-folder" class="sum"></div>
    <div id="sv-pending" class="scanres warn hide"></div>
    <div id="sv-btns" class="hide">
      <button class="btn" id="sv-pick"></button>
      <button class="btn tonal" id="sv-now" data-i18n="b_now"></button>
      <button class="btn tonal" id="sv-reload" data-i18n="b_reload"></button>
    </div>
    <div class="note" id="sv-count"></div>
    <details>
      <summary data-i18n="drive_title"></summary>
      <div class="note" data-i18n-html="drive_steps"></div>
      <div class="note" data-i18n="drive_note"></div>
    </details>
    <details>
      <summary data-i18n="manual_title"></summary>
      <textarea id="sv-text" rows="6" style="margin-top:8px" data-i18n-ph="manual_ph"></textarea>
      <div class="btns2"><button class="btn tonal" id="sv-copy" data-i18n="manual_copy"></button><button class="btn tonal" id="sv-import" data-i18n="manual_import"></button></div>
      <div class="note" data-i18n="manual_note"></div>
    </details>
  </div>
  <div class="card">
    <h3 data-i18n="help_title"></h3>
    <details><summary data-i18n="help_q1"></summary><div class="note" data-i18n-html="help_a1"></div></details>
    <details><summary data-i18n="help_q2"></summary><div class="note" data-i18n-html="help_a2"></div></details>
    <details><summary data-i18n="help_q3"></summary><div class="note" data-i18n-html="help_a3"></div></details>
    <details><summary data-i18n="help_q4"></summary><div class="note" data-i18n-html="help_a4"></div></details>
    <details><summary data-i18n="help_q5"></summary><div class="note" data-i18n-html="help_a5"></div></details>
    <details><summary data-i18n="help_q6"></summary><div class="note" data-i18n-html="help_a6"></div></details>
    <details><summary data-i18n="help_q7"></summary><div class="note" data-i18n-html="help_a7"></div></details>
  </div>
</section>
</main>

<nav class="nav">
  <button data-t="fuel" class="on"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11A2.5 2.5 0 0015.5 9 2.5 2.5 0 0018 11.5c.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5A2.5 2.5 0 0018 21a2.5 2.5 0 002.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg></span><span class="lbl" data-i18n="nav_fuel"></span></button>
  <button data-t="buys"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg></span><span class="lbl" data-i18n="buys"></span></button>
  <button data-t="stats"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg></span><span class="lbl" data-i18n="nav_stats"></span></button>
  <button data-t="save"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.61l-1.92-3.32a.5.5 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.5.5 0 00-.48-.41h-3.84a.5.5 0 00-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 00-.59.22L2.74 8.87a.5.5 0 00.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.5.5 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 00-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg></span><span class="lbl" data-i18n="nav_settings"></span></button>
</nav>

<div id="st" role="status"></div>

  <div class="wrap">

<script>
const $=id=>document.getElementById(id);
const {LANGS,D:DICT}=I18N;
const LK='konso-lang';
let LANG='fr',LOC='fr-FR';
const tx=(k,v)=>{let s=(DICT[LANG]&&DICT[LANG][k])||DICT.fr[k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const fmt=(n,d=2)=>isFinite(n)?n.toLocaleString(LOC,{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const eur=n=>fmt(n)+' €';
// date locale (toISOString donnerait la date UTC : la veille juste après minuit)
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const fdate=s=>{try{return new Date(s+'T12:00:00').toLocaleDateString(LOC)}catch(e){return s}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// valeurs enregistrées dans le fichier (ne changent pas avec la langue) et leur libellé affiché
const FUELV=['SP95-E10','SP95','SP98','E85','GPL','Gazole'];
const CATV=['Huile moteur','Huile boîte / pont','Filtres','Freinage','Suspension / train roulant','Pneus','Liquides','Électricité / éclairage','Pièces moteur','Carrosserie','Outillage','Autre'];
const fuelLabel=v=>('fuel_'+v) in DICT.fr?tx('fuel_'+v):v;
const catLabel=c=>{const i=CATV.indexOf(c);return i>=0?tx('cat'+i):c};

let S={cars:[{id:'c1',name:'',fuel:'SP95-E10'}],cur:'c1',fuel:[],buys:[]}, LS='konso-data';
const carName=c=>c.name||tx('car_default');   // la voiture créée par défaut n'a pas de nom : libellé traduit
// Remet au propre des données venant d'un fichier ou d'un import : types vérifiés, textes bornés,
// lignes inutilisables écartées. Accepte l'ancien format (sans voitures) ; rattache chaque ligne à une voiture.
function norm(d){
  const num=v=>{v=+v;return isFinite(v)?v:0};
  const str=(v,n)=>String(v==null?'':v).slice(0,n);
  const day=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)?v:today();
  const arr=v=>(Array.isArray(v)?v:[]).filter(x=>x&&typeof x==='object');
  const seen=new Set();let auto=Date.now();
  const uid=v=>{let id=num(v);while(!(id>0)||seen.has(id))id=++auto;seen.add(id);return id};
  let cars=arr(d.cars).map(c=>({id:str(c.id,40),name:str(c.name,40).trim(),fuel:str(c.fuel,20)})).filter(c=>c.id);
  cars=cars.filter((c,i)=>cars.findIndex(x=>x.id===c.id)===i);
  if(!cars.length)cars=[{id:'c1',name:'',fuel:'SP95-E10'}];
  const ids=new Set(cars.map(c=>c.id)),car=v=>ids.has(v)?v:cars[0].id;
  const byDate=(a,b)=>b.d.localeCompare(a.d)||b.id-a.id;
  const fuel=arr(d.fuel).map(x=>({id:uid(x.id),car:car(x.car),d:day(x.d),k:num(x.k),l:num(x.l),e:num(x.e),c:str(x.c,40),s:str(x.s,80)})).filter(x=>x.k>0&&x.l>0&&x.e>0).sort(byDate);
  const buys=arr(d.buys).map(x=>({id:uid(x.id),car:car(x.car),d:day(x.d),e:num(x.e),c:str(x.c,60),n:str(x.n,120),k:Math.max(0,num(x.k)),s:str(x.s,80)})).filter(x=>x.e>0).sort(byDate);
  return {cars,cur:car(d.cur),fuel,buys};
}
const curCar=()=>S.cars.find(c=>c.id===S.cur)||S.cars[0];
const FU=()=>S.fuel.filter(f=>f.car===S.cur);
const BU=()=>S.buys.filter(b=>b.car===S.cur);
const NA=(typeof Android!=='undefined')?Android:null;   // pont natif (appli Android)
let folder='', pendingFile=null, setupMode=false;
// Au premier lancement, une fois le dossier choisi, on passe tout seul à l'onglet Pleins (avec une animation).
function finishSetup(){if(!setupMode)return;setupMode=false;setTimeout(()=>showTab('fuel'),900)}

let stT=null;
function status(m){const e=$('st');clearTimeout(stT);e.textContent=m||'';e.classList.toggle('show',!!m);if(m)stT=setTimeout(()=>e.classList.remove('show'),4500)}
function validData(d){return d&&Array.isArray(d.fuel)&&Array.isArray(d.buys)}
function payload(){return JSON.stringify({app:'konso',version:2,saved:new Date().toISOString(),cars:S.cars,cur:S.cur,fuel:S.fuel,buys:S.buys},null,2)}
function cacheSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function cacheLoad(){try{const v=JSON.parse(localStorage.getItem(LS));if(validData(v))return v}catch(e){}return null}
let wt=null;
function persist(){cacheSave();clearTimeout(wt);wt=setTimeout(writeOut,300)}
function writeOut(){
  if(!NA){status(tx('st_local'));return}
  if(!folder){status(tx('st_nofolder'));return}
  try{const r=String(NA.writeFile(payload()));status(r==='ok'?tx('st_saved',{f:folder}):tx('st_wfail',{e:r}))}
  catch(e){status(tx('st_wfail',{e:''}))}
  renderSave();
}
function readFileData(){
  if(!NA||!folder)return null;
  const t=String(NA.readFile()||'');if(!t)return null;
  const d=JSON.parse(t);return validData(d)?d:null;
}

// ---------- langue ----------
function guessLang(){const n=String(navigator.language||'en').slice(0,2).toLowerCase();return LANGS.some(l=>l[0]===n)?n:'en'}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tx(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=tx(e.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-title]').forEach(e=>{const s=tx(e.dataset.i18nTitle);e.title=s;e.setAttribute('aria-label',s)});
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=tx(e.dataset.i18nPh));
  const opts=(el,list,label)=>{const v=el.value;el.innerHTML=list.map((x,i)=>'<option value="'+esc(x)+'"'+(x===''?' disabled':'')+'>'+esc(label(x,i))+'</option>').join('');if(list.includes(v))el.value=v};
  opts($('fc'),['',...FUELV],x=>x?fuelLabel(x):tx('fuel_choose'));opts($('carFuel'),FUELV,fuelLabel);opts($('bc'),CATV,(c,i)=>tx('cat'+i));
  $('langSel').innerHTML=LANGS.map(l=>'<option value="'+l[0]+'">'+esc(l[1])+'</option>').join('');$('langSel').value=LANG;
}
function setLang(l,store){
  const x=LANGS.find(a=>a[0]===l)||LANGS[1];LANG=x[0];LOC=x[2];
  if(store){try{localStorage.setItem(LK,LANG)}catch(e){}}
  applyI18n();applyCarDefaults();render();renderSave();live();
}
// Roue infinie (comme à la configuration d'un téléphone Android) : on fait défiler, puis on valide avec « Suivant ».
function showLangScreen(){
  const N=LANGS.length,IT=56,list=$('wheel-list');
  list.innerHTML=[0,1,2].map(()=>LANGS.map((l,i)=>'<div class="it" data-i="'+i+'">'+esc(l[1])+'</div>').join('')).join('');
  const items=[...list.children];
  let sel=Math.max(0,LANGS.findIndex(l=>l[0]===LANG)),tm=null;
  const paint=()=>{const c=list.scrollTop/IT;items.forEach((e,k)=>{const d=Math.abs(k-c);e.style.opacity=Math.max(.25,1-d*.3);e.style.transform='scale('+Math.max(.72,1-d*.1)+')';e.style.color=d<.5?'var(--on-primary-c)':''})};
  const settle=()=>{
    let k=Math.round(list.scrollTop/IT);const real=((k%N)+N)%N;
    if(k<N||k>=2*N){list.style.scrollSnapType='none';list.scrollTop=(N+real)*IT;list.style.scrollSnapType='';}
    if(real!==sel){sel=real;setLang(LANGS[sel][0],false)}   // aperçu : les textes changent, rien n'est enregistré
    paint();
  };
  list.onscroll=()=>{paint();clearTimeout(tm);tm=setTimeout(settle,130)};
  items.forEach((e,k)=>e.onclick=()=>list.scrollTo({top:k*IT,behavior:'smooth'}));
  $('lang-next').onclick=()=>{setLang(LANGS[sel][0],true);$('lang').classList.add('hide')};
  $('lang').classList.remove('hide');
  list.scrollTop=(N+sel)*IT;paint();
}
$('langSel').onchange=()=>setLang($('langSel').value,true);

function init(){
  let saved=null;try{saved=localStorage.getItem(LK)}catch(e){}
  const known=LANGS.some(l=>l[0]===saved);
  setLang(known?saved:guessLang(),false);
  if(!known)showLangScreen();
  const c=cacheLoad();if(c)S=norm(c);
  if(NA){
    folder=String(NA.folderName()||'');
    if(folder){
      try{
        const d=readFileData();
        if(d){S=norm(d);cacheSave()}
        else if(S.fuel.length||S.buys.length)writeOut();
      }catch(e){status(tx('st_keep'))}
    }
  }
  setupMode=!!NA&&!folder;
  render();renderSave();
  if(setupMode)showTab('save');
}
window.onFolderPicked=function(name){
  const prev=folder;folder=String(name||'');pendingFile=null;
  if(folder===prev){renderSave();return}
  if(folder){
    try{
      const d=readFileData(),has=S.fuel.length||S.buys.length;
      if(d&&!has){S=norm(d);cacheSave();status(tx('st_loaded'))}
      else if(d&&has){pendingFile=d}
      else writeOut();
    }catch(e){status(tx('st_exist_bad'));pendingFile=null}
  }
  render();renderSave();
  if(folder&&!pendingFile)finishSetup();
};
function renderSave(){
  const f=$('sv-folder');if(!f)return;
  if(!NA){f.innerHTML=tx('b_browser');$('sv-btns').classList.add('hide')}
  else{
    $('sv-btns').classList.remove('hide');
    f.innerHTML=folder?tx('b_folder',{f:esc(folder),n:esc(NA.fileName?String(NA.fileName()):'konso.json')}):tx('b_none');
    $('sv-pick').textContent=folder?tx('b_change'):tx('b_pick');
    $('sv-now').classList.toggle('hide',!folder);$('sv-reload').classList.toggle('hide',!folder);
  }
  const p=$('sv-pending');
  if(pendingFile){p.classList.remove('hide');
    p.innerHTML=esc(tx('b_pending',{c:(pendingFile.cars&&pendingFile.cars.length)||1,f:pendingFile.fuel.length,b:pendingFile.buys.length}))+'<div class="btns2"><button class="btn" id="pf-load">'+esc(tx('b_load'))+'</button><button class="btn danger" id="pf-over">'+esc(tx('b_over'))+'</button></div>';
    $('pf-load').onclick=()=>{S=norm(pendingFile);pendingFile=null;cacheSave();render();renderSave();status(tx('st_loaded'));finishSetup()};
    $('pf-over').onclick=()=>{pendingFile=null;writeOut();renderSave();finishSetup()}}
  else p.classList.add('hide');
  $('sv-count').textContent=tx('b_count',{c:S.cars.length,f:S.fuel.length,b:S.buys.length});
}
$('sv-pick').onclick=()=>{if(NA)NA.pickFolder()};
$('sv-now').onclick=()=>writeOut();
$('sv-reload').onclick=()=>{try{const d=readFileData();if(d){S=norm(d);cacheSave();render();status(tx('st_reloaded'))}else status(tx('st_nofile'))}catch(e){status(tx('st_unreadable'))}};
$('sv-copy').onclick=async()=>{const t=payload();$('sv-text').value=t;try{await navigator.clipboard.writeText(t);status(tx('st_copied'))}catch(e){$('sv-text').select();status(tx('st_selcopy'))}};
$('sv-import').onclick=()=>{
  try{const d=JSON.parse($('sv-text').value);if(!validData(d)){status(tx('st_json_bad'));return}
    S=norm(d);persist();render();renderSave();status(tx('st_import_ok'))}
  catch(e){status(tx('st_json_bad'))}
};

// ---------- Lecture du ticket (OCR local, hors ligne) ----------
let ocrWorker=null;
async function getWorker(tick,onErr){
  if(ocrWorker)return ocrWorker;
  const base=new URL('vendor/',location.href).href;
  ocrWorker=await Tesseract.createWorker('fra',1,{workerPath:base+'worker.min.js',corePath:base+'tesseract-core-simd-lstm.wasm.js',langPath:base+'lang',gzip:true,workerBlobURL:false,cacheMethod:'none',logger:tick,errorHandler:onErr});
  return ocrWorker;
}
async function resetWorker(){const w=ocrWorker;ocrWorker=null;if(w){try{await w.terminate()}catch(e){}}}
async function prepImage(file){
  const bmp=await createImageBitmap(file);
  const maxSide=2200,k=Math.min(1.5,maxSide/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,w,h);
  const im=x.getImageData(0,0,w,h),d=im.data,hist=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4){const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);d[i]=d[i+1]=d[i+2]=g;hist[g]++}
  const tot=w*h;let a=0,lo=0,hi=255;
  for(let v=0;v<256;v++){a+=hist[v];if(a>=tot*0.02){lo=v;break}}
  a=0;for(let v=255;v>=0;v--){a+=hist[v];if(a>=tot*0.02){hi=v;break}}
  const sc=hi>lo+10?255/(hi-lo):1;
  for(let i=0;i<d.length;i+=4){const v=Math.max(0,Math.min(255,(d[i]-lo)*sc));d[i]=d[i+1]=d[i+2]=v}
  x.putImageData(im,0,0);
  return await new Promise(r=>c.toBlob(r,'image/png'));
}
function initScan(){
  if(typeof Tesseract==='undefined'||typeof TicketParse==='undefined')return;
  $('scan').classList.remove('hide');
  const box=$('scanres');let busy=false;
  $('sc1').addEventListener('change',async e=>{
    const file=e.target.files&&e.target.files[0];e.target.value='';
    if(!file||busy)return;busy=true;
    const t0=Date.now(),log=[];let last=Date.now(),stage=tx('ocr_stage_prep'),lastKey='';
    const L=m=>log.push(((Date.now()-t0)/1000).toFixed(1)+' s · '+m);
    const tick=m=>{
      last=Date.now();
      if(m&&m.status){
        if(m.status!==lastKey){lastKey=m.status;L(m.status)}
        stage=m.status+(typeof m.progress==='number'?' '+Math.round(m.progress*100)+' %':'');
        box.textContent=tx('ocr_reading')+' '+stage;
      }
    };
    box.className='scanres';box.textContent=tx('ocr_prep');
    let timer;
    const stalled=new Promise((_,rej)=>{timer=setInterval(()=>{if(Date.now()-last>60000)rej(new Error(tx('ocr_stall',{s:stage})))},2000)});
    const work=async()=>{
      const blob=await prepImage(file);L('image '+Math.round(blob.size/1024)+' KB');last=Date.now();
      const w=await getWorker(tick,err=>{L('engine error: '+(err&&err.message?err.message:err));});
      L('engine ready');last=Date.now();
      let best=null,bestScore=-1,bestText='';
      for(const mode of ['6','4']){
        await w.setParameters({tessedit_pageseg_mode:mode,user_defined_dpi:'300'});
        const r=await w.recognize(blob);last=Date.now();
        const p=TicketParse.parseTicket(r.data.text);
        const sc=(p.litres&&p.prix&&p.montant&&!p.notes.length?10:0)+['station','date','litres','prix','montant','carburant'].filter(k=>p[k]).length;
        L('mode '+mode+' : score '+sc);
        if(sc>bestScore){bestScore=sc;best=p;bestText=r.data.text}
        if(sc>=10)break;
      }
      return {best,bestText};
    };
    try{
      const {best:r,bestText}=await Promise.race([work(),stalled]);
      if(r.date)$('fd').value=r.date;
      if(r.litres)$('fl').value=r.litres;
      if(r.montant)$('fe').value=r.montant;
      if(r.station)$('fs').value=r.station.slice(0,80);
      const fuelOk=!!r.carburant&&FUELV.includes(r.carburant);
      if(fuelOk){setFuelPending(false);$('fc').value=r.carburant}else setFuelPending(true);
      live();
      const warns=r.notes.map(c=>tx('note_'+c));
      if(!fuelOk)warns.unshift(tx('ocr_fuel_miss'));
      const miss=[];if(!r.litres)miss.push(tx('ocr_l'));if(!r.montant)miss.push(tx('ocr_m'));
      if(miss.length)warns.push(tx('ocr_notread',{x:miss.join(', ')}));
      if(!r.station)warns.push(tx('ocr_station_miss'));
      box.className='scanres'+(warns.length?' warn':'');
      box.innerHTML='<b>'+esc(tx('ocr_title'))+'</b><br>'+esc(r.station||tx('ocr_station_q'))+' · '+(r.date?fdate(r.date):esc(tx('ocr_date_q')))+'<br>'+(r.litres?fmt(r.litres)+' L':'? L')+' · '+(r.prix?fmt(r.prix,3)+' €/L':'? €/L')+' · '+(r.montant?eur(r.montant):'? €')+' · '+(fuelOk?esc(fuelLabel(r.carburant)):'? '+esc(tx('fuel')))+warns.map(w=>'<div class="w">'+esc(w)+'</div>').join('')+'<div class="note">'+esc(tx('ocr_verify'))+'</div><details><summary class="note">'+esc(tx('ocr_text'))+'</summary><pre style="white-space:pre-wrap;font-size:11px">'+esc(bestText)+'</pre></details>';
      $('fk').focus();
    }catch(err){
      await resetWorker();
      box.className='scanres warn';
      box.innerHTML=esc(tx('ocr_fail',{e:err&&err.message?err.message:String(err)}))+'<details><summary class="note">'+esc(tx('ocr_tech'))+'</summary><pre style="white-space:pre-wrap;font-size:11px">'+esc(log.join('\n'))+'</pre></details>';
    }finally{clearInterval(timer);busy=false}
  });
}

// Live calc
function live(){
  const k=+$('fk').value,l=+$('fl').value,e=+$('fe').value;
  $('l1').textContent=k>0&&l>0?fmt(l/k*100):'–';
  $('l2').textContent=k>0&&e>0?fmt(e/k*100):'–';
  $('l3').textContent=l>0&&e>0?fmt(e/l,3):'–';
}
['fk','fl','fe'].forEach(i=>$(i).addEventListener('input',live));

$('addF').onclick=()=>{
  const k=+$('fk').value,l=+$('fl').value,e=+$('fe').value;
  if(!(k>0&&l>0&&e>0)){status(tx('need_fill'));return}
  if(!FUELV.includes($('fc').value)){setFuelPending(true);status(tx('need_fuel'));$('fc').focus();return}
  S.fuel.unshift({id:Date.now(),car:S.cur,d:$('fd').value||today(),k,l,e,c:$('fc').value,s:$('fs').value.trim()});
  S.fuel.sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  ['fk','fl','fe','fs'].forEach(i=>$(i).value='');setFuelPending(false);live();persist();render();applyCarDefaults();
};
$('addB').onclick=()=>{
  const e=+$('be').value;
  if(!(e>0)){status(tx('need_amount'));return}
  S.buys.unshift({id:Date.now(),car:S.cur,d:$('bd').value||today(),e,c:$('bc').value,n:$('bn').value.trim(),k:+$('bk').value||0,s:$('bs').value.trim()});
  S.buys.sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  ['be','bn','bk','bs'].forEach(i=>$(i).value='');persist();render();
};
// pas de confirm() (bloqué) : suppression en deux appuis
let armed=null;
function delClick(kind,id,btn){
  const key=kind+id;
  if(armed!==key){armed=key;btn.classList.add('armed');btn.textContent=tx('del_confirm');setTimeout(()=>{if(armed===key){armed=null;render()}},3000);return}
  S[kind]=S[kind].filter(x=>x.id!==id);armed=null;persist();render();
}
const TRASH='<svg class="i" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';

function render(){
  renderCars();
  const fl=$('fl-list');
  fl.innerHTML=FU().length?FU().map(f=>`<div class="row"><div class="l"><div class="t">${fdate(f.d)} · ${fmt(f.k,0)} km</div><div class="m">${fmt(f.l)} L · ${fmt(f.e/f.l,3)} €/L · ${esc(fuelLabel(f.c))}${f.s?' · '+esc(f.s):''}</div></div><div class="r"><div class="t">${fmt(f.l/f.k*100)} L/100</div><div class="m">${eur(f.e)}</div></div><button class="del" data-k="fuel" data-i="${esc(f.id)}" aria-label="${esc(tx('del'))}">${TRASH}</button></div>`).join(''):'<div class="empty">'+esc(tx('empty_fuel'))+'</div>';
  const bl=$('bl-list');
  bl.innerHTML=BU().length?BU().map(b=>`<div class="row"><div class="l"><div class="t">${esc(b.n)||esc(catLabel(b.c))}</div><div class="m">${fdate(b.d)} · ${esc(catLabel(b.c))}${b.k?' · '+fmt(b.k,0)+' km':''}${b.s?' · '+esc(b.s):''}</div></div><div class="r"><div class="t">${eur(b.e)}</div></div><button class="del" data-k="buys" data-i="${esc(b.id)}" aria-label="${esc(tx('del'))}">${TRASH}</button></div>`).join(''):'<div class="empty">'+esc(tx('empty_buys'))+'</div>';
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>delClick(b.dataset.k,+b.dataset.i,b));
  // bilan
  const F=FU(),B=BU();
  const km=F.reduce((a,x)=>a+x.k,0),L=F.reduce((a,x)=>a+x.l,0),E=F.reduce((a,x)=>a+x.e,0);
  const st=(v,l)=>`<div class="stat"><b>${v}</b><span>${esc(l)}</span></div>`;
  $('sf').innerHTML=F.length?st(fmt(L/km*100)+'<small style="font-size:14px"> L/100 km</small>',tx('s_avg'))+st(eur(E/km*100),tx('s_cost100'))+st(fmt(E/L,3)+' €',tx('s_price'))+st(fmt(km,0)+' km',tx('s_km')):'<div class="empty" style="grid-column:1/-1">'+esc(tx('s_empty'))+'</div>';
  $('sfn').textContent='';
  const BT=B.reduce((a,x)=>a+x.e,0);
  $('sx').innerHTML=(F.length||B.length)?`<div class="kv"><span>${esc(tx('fuel'))}</span><span>${eur(E)}</span></div><div class="kv"><span>${esc(tx('buys'))}</span><span>${eur(BT)}</span></div><div class="kv tot"><span>${esc(tx('s_total'))}</span><span>${eur(E+BT)}</span></div>`:'<div class="empty">'+esc(tx('s_nospend'))+'</div>';
  const by={};B.forEach(b=>by[b.c]=(by[b.c]||0)+b.e);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=ent.length?ent[0][1]:1;
  $('cats').innerHTML=ent.length?'<div class="note" style="margin:0 0 8px">'+esc(tx('s_by_cat'))+'</div>'+ent.map(([c,v])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(catLabel(c))}</span><b style="font-weight:500">${eur(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join(''):'';
  lineChart();barChart();
}
const monthName=i=>new Date(2000,i,1).toLocaleDateString(LOC,{month:'short'});
const sd=s=>s.slice(8,10)+'/'+s.slice(5,7);
function niceTicks(lo,hi,n){
  const raw=(hi-lo)/n||1,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  const st=(f<=1?1:f<=2?2:f<=5?5:10)*p,a=Math.floor(lo/st)*st,t=[];
  for(let v=a;v<=hi+st*0.999;v+=st)t.push(+v.toFixed(6));
  return t;
}
// Détail d'un graphique : souris = au survol ; doigt = un appui OU un maintien l'affiche, et il reste jusqu'à un appui ailleurs.
function wireTip(svg,show,hide){
  const touch=e=>e.pointerType==='touch'||e.pointerType==='pen';
  svg.addEventListener('pointerdown',show);
  svg.addEventListener('pointermove',e=>{if(!touch(e)||e.buttons)show(e)});
  svg.addEventListener('pointerleave',e=>{if(!touch(e))hide()});
  svg.addEventListener('contextmenu',e=>e.preventDefault());
}
document.addEventListener('pointerdown',e=>{
  document.querySelectorAll('.chart').forEach(box=>{if(box.contains(e.target))return;
    box.querySelectorAll('.tip').forEach(t=>t.style.display='none');box.querySelectorAll('#c1v,#c1h').forEach(x=>x.style.display='none')});
});
function tipShow(box,html,x,W,rect){
  const t=box.querySelector('.tip');t.innerHTML=html;t.style.display='block';
  const px=Math.max(60,Math.min(rect.width-60,x/W*rect.width));t.style.left=px+'px';
}
function lineChart(){
  const box=$('c1'),data=[...FU()].sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id).map(f=>({d:f.d,v:f.l/f.k*100,e:f.e/f.k*100,k:f.k,l:f.l}));
  if(data.length<2){box.innerHTML='<div class="empty">'+esc(tx('s_need2'))+'</div>';$('c1s').textContent='';return}
  const km=data.reduce((a,x)=>a+x.k,0),avg=data.reduce((a,x)=>a+x.l,0)/km*100;
  const W=600,H=220,m={l:38,r:12,t:14,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const vs=data.map(x=>x.v),lo=Math.min(...vs,avg),hi=Math.max(...vs,avg),pad=(hi-lo||1)*0.15;
  const tk=niceTicks(lo-pad,hi+pad,4),y0=tk[0],y1=tk[tk.length-1];
  const X=i=>m.l+iw*i/(data.length-1),Y=v=>m.t+ih*(1-(v-y0)/(y1-y0));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tx('s_chart1'))}">`;
  tk.forEach(v=>{s+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v,v%1?1:0)}</text>`});
  s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--on-surf-v)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s+=`<text x="${W-m.r}" y="${Y(avg)-5}" text-anchor="end">${esc(tx('chart_avg'))} ${fmt(avg,1)}</text>`;
  s+=`<polyline fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${data.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>`;
  data.forEach((x,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(x.v)}" r="4" fill="var(--s1)" stroke="var(--surf)" stroke-width="2"/>`});
  const lab=[0,Math.floor((data.length-1)/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  lab.forEach(i=>{s+=`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===data.length-1?'end':'middle'}">${sd(data[i].d)}</text>`});
  const lastI=data.length-1;
  s+=`<text x="${X(lastI)}" y="${Y(data[lastI].v)-9}" text-anchor="end" style="fill:var(--on-surf);font-weight:700">${fmt(data[lastI].v,1)}</text>`;
  s+=`<line id="c1v" y1="${m.t}" y2="${m.t+ih}" stroke="var(--on-surf-v)" stroke-width="1" style="display:none"/><circle id="c1h" r="6" fill="var(--s1)" stroke="var(--surf)" stroke-width="2" style="display:none"/></svg><div class="tip"></div>`;
  box.innerHTML=s;
  const svg=box.querySelector('svg'),vl=svg.querySelector('#c1v'),hc=svg.querySelector('#c1h');
  const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;
    let i=Math.round((px-m.l)/iw*(data.length-1));i=Math.max(0,Math.min(data.length-1,i));
    const d=data[i];vl.setAttribute('x1',X(i));vl.setAttribute('x2',X(i));vl.style.display='';
    hc.setAttribute('cx',X(i));hc.setAttribute('cy',Y(d.v));hc.style.display='';
    tipShow(box,`<b>${fdate(d.d)}</b><br>${fmt(d.v)} L/100 km<br>${fmt(d.e)} €/100 km<br>${fmt(d.k,0)} km · ${fmt(d.l)} L`,X(i),W,r)};
  wireTip(svg,move,()=>{vl.style.display='none';hc.style.display='none';box.querySelector('.tip').style.display='none'});
  const last=data[lastI].v,diff=last-avg;
  $('c1s').innerHTML=tx('last_fill',{v:fmt(last),d:(diff>=0?'+':'−')+fmt(Math.abs(diff)),a:fmt(avg)});
}
function barChart(){
  const box=$('c2'),by={};
  FU().forEach(f=>{const k=f.d.slice(0,7);(by[k]=by[k]||{f:0,b:0}).f+=f.e});
  BU().forEach(b=>{const k=b.d.slice(0,7);(by[k]=by[k]||{f:0,b:0}).b+=b.e});
  const keys=Object.keys(by).sort().slice(-6);
  if(!keys.length){box.innerHTML='<div class="empty">'+esc(tx('s_nospend'))+'</div>';return}
  const W=600,H=230,m={l:44,r:10,t:18,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const mx=Math.max(...keys.map(k=>by[k].f+by[k].b)),tk=niceTicks(0,mx*1.05,4),y1=tk[tk.length-1];
  const Y=v=>m.t+ih*(1-v/y1),band=iw/keys.length,bw=Math.min(56,band*0.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tx('s_chart2'))}">`;
  tk.forEach(v=>{s+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v,0)}</text>`});
  keys.forEach((k,i)=>{
    const d=by[k],cx=m.l+band*(i+.5),x=cx-bw/2,[yy,mm]=k.split('-'),hf=ih*d.f/y1,hb=ih*d.b/y1;
    if(d.f>0)s+=`<rect x="${x}" y="${Y(d.f)}" width="${bw}" height="${Math.max(hf,1)}" rx="${d.b>0?0:4}" fill="var(--s1)"/>`;
    if(d.b>0)s+=`<rect x="${x}" y="${Y(d.f+d.b)}" width="${bw}" height="${Math.max(hb-(d.f>0?2:0),1)}" rx="4" fill="var(--s2)"/>`;
    s+=`<text x="${cx}" y="${Y(d.f+d.b)-5}" text-anchor="middle" style="fill:var(--on-surf);font-weight:600">${fmt(d.f+d.b,0)}</text>`;
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(monthName(+mm-1))} ${yy.slice(2)}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${m.l+band*i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/>`;
  });
  s+=`</svg><div class="tip"></div>`;box.innerHTML=s;
  const svg=box.querySelector('svg');
  const show=e=>{const el=document.elementFromPoint(e.clientX,e.clientY),h=el&&el.closest?el.closest('.hit'):null;if(!h)return;const i=+h.dataset.i,d=by[keys[i]],r=svg.getBoundingClientRect(),[yy,mm]=keys[i].split('-');
    tipShow(box,`<b>${esc(monthName(+mm-1))} ${yy}</b><br>${esc(tx('fuel'))} : ${eur(d.f)}<br>${esc(tx('buys'))} : ${eur(d.b)}<br>${esc(tx('s_total'))} : ${eur(d.f+d.b)}`,m.l+band*(i+.5),W,r)};
  wireTip(svg,show,()=>{box.querySelector('.tip').style.display='none'});
}
let carEditing=null,carDelArmed=false;
function renderCars(){
  const sel=$('car');
  sel.innerHTML=S.cars.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===S.cur?' selected':'')+'>'+esc(carName(c))+'</option>').join('');
}
function openCarForm(edit){
  carEditing=edit?S.cur:null;carDelArmed=false;
  $('carFormTitle').textContent=edit?tx('car_edit'):tx('car_new');
  const c=edit?curCar():null;
  $('carName').value=c?carName(c):'';
  $('carFuel').value=(c&&c.fuel)||'SP95-E10';
  $('carDel').classList.toggle('hide',!(edit&&S.cars.length>1));
  $('carDel').textContent=tx('car_del');
  $('carNote').textContent=edit?(S.cars.length>1?tx('car_note_del'):tx('car_note_keep')):'';
  $('carForm').classList.remove('hide');$('carName').focus();
}
// Carburant présélectionné : celui du dernier plein de la voiture, sinon son carburant habituel.
// Après un ticket dont le carburant n'a pas été reconnu, on ne présélectionne rien : le choix est obligatoire.
let fuelPending=false;
function setFuelPending(on){fuelPending=on;$('fc').closest('.f').classList.toggle('need',on);if(on)$('fc').value=''}
function defaultFuel(){const last=FU().find(f=>FUELV.includes(f.c)),c=curCar();return last?last.c:(c&&FUELV.includes(c.fuel)?c.fuel:'SP95-E10')}
function applyCarDefaults(){if(!fuelPending)$('fc').value=defaultFuel()}
$('fc').addEventListener('change',()=>{if(FUELV.includes($('fc').value))setFuelPending(false)});
$('car').onchange=()=>{S.cur=$('car').value;persist();render();applyCarDefaults()};
$('carAdd').onclick=()=>openCarForm(false);
$('carEdit').onclick=()=>openCarForm(true);
$('carCancel').onclick=()=>$('carForm').classList.add('hide');
$('carSave').onclick=()=>{
  const name=$('carName').value.trim();
  if(!name){status(tx('car_need_name'));return}
  if(S.cars.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.id!==carEditing)){status(tx('car_dup'));return}
  if(carEditing){const c=S.cars.find(x=>x.id===carEditing);c.name=name;c.fuel=$('carFuel').value}
  else{const id='c'+Date.now();S.cars.push({id,name,fuel:$('carFuel').value});S.cur=id}
  $('carForm').classList.add('hide');persist();render();applyCarDefaults();
};
$('carDel').onclick=()=>{
  if(!carDelArmed){carDelArmed=true;const n=FU().length+BU().length;$('carDel').textContent=tx('car_del_confirm',{n});return}
  const id=carEditing;
  S.cars=S.cars.filter(c=>c.id!==id);S.fuel=S.fuel.filter(f=>f.car!==id);S.buys=S.buys.filter(b=>b.car!==id);
  S.cur=S.cars[0].id;$('carForm').classList.add('hide');persist();render();applyCarDefaults();
};
function showTab(t){
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  ['fuel','buys','stats','save'].forEach(id=>$(id).classList.toggle('hide',id!==t));
  const el=$(t);el.classList.remove('tabin');void el.offsetWidth;el.classList.add('tabin');
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
// le clavier ouvert masque la barre du bas
document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&e.target.type!=='date')document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA)$/.test(a.tagName))document.body.classList.remove('kb')},150));
$('fd').value=today();$('bd').value=today();
init();initScan();applyCarDefaults();
</script>
