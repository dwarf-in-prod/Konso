plugins {
    id 'com.android.application'
}

// APK de test (branches) : ./gradlew assembleDebug -PkonsoTest=<nom-de-branche>
// Donne une appli séparée "Konso Test" (app.konso.test), installable à côté de la vraie.
def konsoTest = project.findProperty('konsoTest')

android {
    namespace 'app.konso'
    compileSdk 34

    defaultConfig {
        applicationId 'app.konso'
        minSdk 29
        targetSdk 34
        versionCode 11
        versionName '2.0'
        manifestPlaceholders = [appLabel: 'Konso']
    }

    signingConfigs {
        // Clé de signature fixe, versionnée dans le dépôt : les mises à jour s'installent par-dessus la version précédente.
        // Elle est publique : pour distribuer l'appli sérieusement, remplace-la par ta propre clé gardée secrète.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            if (konsoTest) {
                applicationIdSuffix '.test'
                versionNameSuffix "-test-${konsoTest}"
                manifestPlaceholders = [appLabel: 'Konso Test']
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
