plugins {
    id 'com.android.application'
}

// Test APK (built for every branch): ./gradlew assembleDebug -PkonsoTest=<branch-name>
// It is a separate app, "Konso Test" (app.konso.test), installable next to the real one.
// MainActivity gives it its own port and backup file, so it never touches the real app's data.
def konsoTest = project.findProperty('konsoTest')

android {
    namespace 'app.konso'
    compileSdk 34

    defaultConfig {
        applicationId 'app.konso'
        minSdk 29
        targetSdk 34
        versionCode 18
        versionName '2.7'
        manifestPlaceholders = [appLabel: 'Konso']
    }

    signingConfigs {
        // Fixed signing key, committed in the repository, so that updates install over the previous version.
        // It is public: anyone redistributing the app should use their own secret key instead.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            if (konsoTest) {
                applicationIdSuffix '.test'
                versionNameSuffix "-test-${konsoTest}"
                manifestPlaceholders = [appLabel: 'Konso Test']
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
