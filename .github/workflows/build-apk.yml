name: Build APK

# - main: builds the APK. When run by hand, or when the commit message contains [release], it also
#   publishes the versioned release "v<versionName>" (once per version; its tag is what F-Droid and
#   IzzyOnDroid follow) and recreates the "latest" release linked from the README.
# - any other branch: builds a test APK, "Konso Test" (separate app, app.konso.test), and publishes it
#   in the "test-<branch>" pre-release.
# - deleted branch: its test pre-release is deleted.

on:
  push:
    branches: ['**', '!gh-pages'] # gh-pages holds the web version (web.yml), not code
  workflow_dispatch:
  delete:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    concurrency:
      group: apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      BRANCH: ${{ github.ref_name }}
      IS_MAIN: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build
        run: |
          if [ "$IS_MAIN" = "true" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            SLUG=$(printf '%s' "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
            echo "SLUG=$SLUG" >> "$GITHUB_ENV"
            ./gradlew assembleDebug --no-daemon -PkonsoTest="$SLUG-${GITHUB_SHA::7}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IS_MAIN == 'true' && 'konso-apk' || 'konso-test-apk' }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK in the releases (main)
        if: env.IS_MAIN == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
        run: |
          # 1. Versioned release v<versionName> (konso-<versionName>.apk), created once per version:
          #    F-Droid and IzzyOnDroid detect new versions from its tag.
          #    Notes: fastlane/metadata/android/en-US/changelogs/<versionCode>.txt if it exists.
          VERSION=$(sed -n "s/^ *versionName '\(.*\)'.*/\1/p" app/build.gradle)
          CODE=$(sed -n "s/^ *versionCode \([0-9]*\).*/\1/p" app/build.gradle)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::warning::Release v$VERSION already exists: increase versionCode and versionName to publish a new version."
          else
            cp app/build/outputs/apk/debug/app-debug.apk "konso-$VERSION.apk"
            NOTES="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
            [ -f "$NOTES" ] || { echo "Konso $VERSION (versionCode $CODE)." > notes.txt; NOTES=notes.txt; }
            gh release create "v$VERSION" "konso-$VERSION.apk" \
              --title "Konso $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA" --latest=false
          fi
          # 2. "latest" release (konso.apk), recreated every time: the README links to it.
          cp app/build/outputs/apk/debug/app-debug.apk konso.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest konso.apk \
            --title "Konso – latest version" \
            --notes "APK built automatically from commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
      - name: Publish the test APK in the test-<branch> pre-release
        if: env.IS_MAIN != 'true'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk konso-test.apk
          gh release delete "test-$SLUG" --yes --cleanup-tag || true
          gh release create "test-$SLUG" konso-test.apk --prerelease \
            --title "Konso Test – $BRANCH" \
            --notes "Test APK of branch $BRANCH (commit ${GITHUB_SHA::7}). Installs next to Konso as \"Konso Test\", with its own backup file konso-test.json: the data of the real app is never touched." \
            --target "$GITHUB_SHA"

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the test pre-release of the branch
        run: |
          SLUG=$(printf '%s' "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
          gh release delete "test-$SLUG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
