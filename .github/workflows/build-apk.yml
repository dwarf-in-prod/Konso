name: Compiler l'APK

# - main : compile l'APK ; sur lancement manuel ou si le message du commit contient [release],
#   publie la release versionnée « v<versionName> » (une seule fois par version, son tag sert
#   à F-Droid / IzzyOnDroid) et recrée la release « latest ».
# - autre branche : compile un APK de test « Konso Test » (appli séparée, app.konso.test)
#   et le publie dans la pré-release « test-<branche> ».
# - branche supprimée : sa pré-release de test est supprimée.

on:
  push:
    branches: ['**']
  workflow_dispatch:
  delete:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    concurrency:
      group: apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      BRANCH: ${{ github.ref_name }}
      IS_MAIN: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Rendre gradlew exécutable
        run: chmod +x gradlew
      - name: Compiler
        run: |
          if [ "$IS_MAIN" = "true" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            SLUG=$(printf '%s' "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
            echo "SLUG=$SLUG" >> "$GITHUB_ENV"
            ./gradlew assembleDebug --no-daemon -PkonsoTest="$SLUG-${GITHUB_SHA::7}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IS_MAIN == 'true' && 'konso-apk' || 'konso-test-apk' }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK dans la release « latest » (main)
        if: env.IS_MAIN == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
        run: |
          # 1. Release versionnée v<versionName> (konso-<versionName>.apk), créée une seule fois par version :
          #    son tag sert à F-Droid et IzzyOnDroid pour détecter les nouvelles versions.
          #    Notes : fastlane/metadata/android/en-US/changelogs/<versionCode>.txt s'il existe.
          VERSION=$(sed -n "s/^ *versionName '\(.*\)'.*/\1/p" app/build.gradle)
          CODE=$(sed -n "s/^ *versionCode \([0-9]*\).*/\1/p" app/build.gradle)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::warning::La release v$VERSION existe déjà : augmente versionCode et versionName pour publier une nouvelle version."
          else
            cp app/build/outputs/apk/debug/app-debug.apk "konso-$VERSION.apk"
            NOTES="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
            [ -f "$NOTES" ] || { echo "Konso $VERSION (versionCode $CODE)." > notes.txt; NOTES=notes.txt; }
            gh release create "v$VERSION" "konso-$VERSION.apk" \
              --title "Konso $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA" --latest=false
          fi
          # 2. Release « latest » (konso.apk), recréée à chaque fois : c'est elle que pointe le README.
          cp app/build/outputs/apk/debug/app-debug.apk konso.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest konso.apk \
            --title "Konso – dernière version" \
            --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
      - name: Publier l'APK de test dans la pré-release « test-<branche> »
        if: env.IS_MAIN != 'true'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk konso-test.apk
          gh release delete "test-$SLUG" --yes --cleanup-tag || true
          gh release create "test-$SLUG" konso-test.apk --prerelease \
            --title "Konso Test – $BRANCH" \
            --notes "APK de test de la branche $BRANCH (commit ${GITHUB_SHA::7}). S'installe à côté de Konso sous le nom « Konso Test », avec son propre fichier de sauvegarde konso-test.json : les données de la vraie appli ne sont jamais touchées." \
            --target "$GITHUB_SHA"

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Supprimer la pré-release de test de la branche
        run: |
          SLUG=$(printf '%s' "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
          gh release delete "test-$SLUG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
