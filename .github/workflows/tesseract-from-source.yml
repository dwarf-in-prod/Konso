name: Tesseract from source

# Rebuilds the bundled OCR engine (vendor/) from its sources with tools/build-tesseract.sh, then
# checks with tools/ocr-test.js that the rebuilt files read text correctly.
# This proves the app can be built without pre-built code (an F-Droid requirement).
# The rebuilt files are attached to the run (artifact "tesseract-rebuilt"); the files in the
# repository are not changed.

on:
  push:
    paths:
      - 'tools/build-tesseract.sh'
      - 'tools/ocr-test.js'
      - 'app/src/main/assets/www/vendor/**'
      - '.github/workflows/tesseract-from-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake make
      - name: Emscripten 4.0.15
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.15
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.15
      - name: Rebuild Tesseract
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          tools/build-tesseract.sh --work "$RUNNER_TEMP/tesseract" --out build/rebuilt
      - name: Compare with the files in the repository
        run: |
          for f in tesseract-core-simd-lstm.wasm.js tesseract.min.js worker.min.js; do
            if cmp -s "build/rebuilt/$f" "app/src/main/assets/www/vendor/$f"; then
              echo "$f: identical to the file in the repository"
            else
              echo "$f: differs from the file in the repository ($(stat -c %s "build/rebuilt/$f") bytes vs $(stat -c %s "app/src/main/assets/www/vendor/$f"))"
            fi
          done
      - name: Test the OCR with the rebuilt files
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node tools/ocr-test.js build/rebuilt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-rebuilt
          path: build/rebuilt/
          if-no-files-found: ignore
