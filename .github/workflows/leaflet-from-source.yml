name: Leaflet from source

# Rebuilds the bundled map library (vendor/leaflet.js, leaflet.css) from its sources with
# tools/build-leaflet.sh, then checks that the rebuilt files are identical, byte for byte, to the
# ones in the repository. This proves the app ships no pre-built code that cannot be rebuilt
# (an F-Droid requirement). The rebuilt files are attached to the run (artifact
# "leaflet-rebuilt"); the files in the repository are not changed.

on:
  push:
    paths:
      - 'tools/build-leaflet.sh'
      - 'app/src/main/assets/www/vendor/leaflet*'
      - 'app/src/main/assets/www/vendor/LICENSE-leaflet.txt'
      - '.github/workflows/leaflet-from-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild Leaflet
        run: tools/build-leaflet.sh --work "$RUNNER_TEMP/leaflet" --out build/rebuilt
      - name: Compare with the files in the repository
        run: |
          status=0
          for f in leaflet.js leaflet.css LICENSE-leaflet.txt; do
            if cmp -s "build/rebuilt/$f" "app/src/main/assets/www/vendor/$f"; then
              echo "$f: identical to the file in the repository"
            else
              echo "::error::$f differs from the file in the repository"
              status=1
            fi
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaflet-rebuilt
          path: build/rebuilt/
          if-no-files-found: ignore
